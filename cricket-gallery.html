<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricket Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Joesal's Cricket World</h1>
</header>

<div class="container">

    <div class="panel">

        <h2>Cricket Gallery</h2>

        <div class="gallery">

            <figure>
                <img
                src="https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=800"
                alt="Cricket stadium">

                <figcaption>Cricket Stadium</figcaption>
            </figure>

            <figure>
                <img
                src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=800"
                alt="International stadium">

                <figcaption>International Match</figcaption>
            </figure>

            <figure>
                <img
                src="https://images.unsplash.com/photo-1593766827228-8737b58e3b61?w=800"
                alt="Cricket action">

                <figcaption>Cricket Action</figcaption>
            </figure>

            <figure>
                <img
                src="https://images.unsplash.com/photo-1624526267942-ab0ff8a3e972?w=800"
                alt="Cricket player">

                <figcaption>Batsman in Action</figcaption>
            </figure>

            <figure>
                <img
                src="https://images.unsplash.com/photo-1599586120429-48281b6f0b2a?w=800"
                alt="Sports field">

                <figcaption>Night Match</figcaption>
            </figure>

            <figure>
                <img
                src="https://images.unsplash.com/photo-1521412644187-c49fa049e84d?w=800"
                alt="Sports equipment">

                <figcaption>Cricket Equipment</figcaption>
            </figure>

        </div>

    </div>

</div>

</body>
</html>
